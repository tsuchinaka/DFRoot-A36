<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="108" height="108"
     viewBox="0 0 108 108"
     role="img"
     aria-label="DFRoot: white box with dollar sign on purple">

    <!-- purple background (covers the full adaptive-icon canvas) -->
