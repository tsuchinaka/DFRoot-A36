        <!-- empty box -->
        <rect x="21" y="21" width="66" height="66" rx="16" ry="16" />
        <!-- dollar stem -->
        <path d="M54 32 L54 76" />
        <!-- dollar S curve -->
        <path d="M62 42
                 C59.5 38.5 56.5 36.5 52.5 36.5
                 C47 36.5 43 40 43 44.8
                 C43 50 47.5 52 53.5 53.6
                 C59.5 55.2 64 57.6 64 63.6
                 C64 69.5 59 73 53.5 73
                 C48.5 73 44.5 70.6 42 67" />
