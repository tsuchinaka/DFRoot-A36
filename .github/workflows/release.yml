name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Keystore
        run: ./create-keystore.sh
      - name: Unit tests
        run: ./gradlew :app:test --no-daemon --console=plain
      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Verify artifacts
        run: ./tools/check-build.sh
      - name: Stage asset
        run: cp app/build/outputs/apk/release/app-release.apk dfroot.apk
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dfroot.apk \
            --title "DFRoot A36 $GITHUB_REF_NAME" \
            --generate-notes
